# Dev profile — local Postgres via docker-compose at repo root.
# Credentials match the docker-compose.yml service.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_buddy}
    username: ${DB_USERNAME:job_buddy}
    password: ${DB_PASSWORD:dev}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
