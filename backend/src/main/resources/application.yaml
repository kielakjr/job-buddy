spring:
  application:
    name: job-buddy

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:noop-dev}
            client-secret: ${GOOGLE_CLIENT_SECRET:noop-dev}
            scope:
              - openid
              - email
              - profile
          # LinkedIn uses the "Sign In with LinkedIn using OpenID Connect" product
          # (NOT the legacy r_liteprofile / r_emailaddress scopes). The provider
          # must be enabled on the LinkedIn app under Products.
          linkedin:
            client-id: ${LINKEDIN_CLIENT_ID:noop-dev}
            client-secret: ${LINKEDIN_CLIENT_SECRET:noop-dev}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile
            client-name: LinkedIn
        provider:
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/userinfo
            user-name-attribute: sub
            jwk-set-uri: https://www.linkedin.com/oauth/openid/jwks

app:
  auth:
    success-redirect: ${AUTH_SUCCESS_REDIRECT:/}
