name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Build & Test (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check formatting (Spotless)
        working-directory: backend
        run: ./mvnw -B -ntp spotless:check

      - name: Compile
        working-directory: backend
        run: ./mvnw -B -ntp compile

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B -ntp test
