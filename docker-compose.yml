# Local dev only. Credentials here are NOT secrets — never reuse anywhere else.
# Production DB is provisioned on Supabase and configured via env vars.
services:
  postgres:
    image: postgres:16
    container_name: job_buddy_postgres
    environment:
      POSTGRES_DB: job_buddy
      POSTGRES_USER: job_buddy
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - job_buddy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_buddy -d job_buddy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  job_buddy_pg_data:
